version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: micro
      POSTGRES_PASSWORD: micropass
      POSTGRES_DB: microbank
    ports:
      - '5432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://micro:micropass@db:5432/microbank
      - PORT=5000
      - SAFARICOM_CONSUMER_KEY=
      - SAFARICOM_CONSUMER_SECRET=
      - MPESA_SHORTCODE=
      - MPESA_PASSKEY=
      - MPESA_CALLBACK_URL=http://host.docker.internal:5000/api/mpesa/callback
      - TWILIO_SID=
      - TWILIO_AUTH_TOKEN=
      - TWILIO_PHONE_NUMBER=
    ports:
      - '5000:5000'

volumes:
  db_data:
